{% extends "home/base.html" %}
{% load static %}

{% block title %}Forgot Password - FocusFrame{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}

{% block content %}

<main class="auth-main">

    <div class="auth-container">

        <div class="viewfinder auth-card is-visible">

            <div class="auth-card-inner">

                <span class="eyebrow">
                    Account Recovery
                </span>

                <h1 class="auth-title">
                    Forgot Password?
                </h1>

                <p class="auth-sub">
                    Enter your registered email address.
                </p>

                <form method="POST">

                    {% csrf_token %}

                    <div class="field">

                        <label for="id_email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            id="id_email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-block"
                    >
                        Send Reset Link
                    </button>

                </form>

                <p class="auth-switch">

                    <a href="{% url 'login' %}">
                        Back to Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</main>

{% endblock %}
