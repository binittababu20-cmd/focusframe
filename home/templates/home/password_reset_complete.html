{% extends "home/base.html" %}
{% load static %}

{% block title %}Forgot Password - FocusFrame{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% endblock %}
{% block content %}

<main class="auth-main">

    <div class="auth-container">

        <div class="viewfinder auth-card is-visible">

            <div class="auth-card-inner">

                <span class="eyebrow">
                    Account Recovery
                </span>

                <h1 class="auth-title">
                    Password Changed
                </h1>

                <p class="auth-sub">
                    Your password has been successfully changed.
                </p>

                <a
                    href="{% url 'login' %}"
                    class="btn btn-primary btn-block"
                >
                    Sign In
                </a>

            </div>

        </div>

    </div>

</main>

{% endblock %}
